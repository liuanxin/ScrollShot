plugins { id "com.android.application" }

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace "io.github.liuanxin.scrollshot"
    compileSdk 36
    defaultConfig {
        applicationId "io.github.liuanxin.scrollshot"
        minSdk 34
        targetSdk 36
        versionCode 10000
        versionName "1.0.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile rootProject.file(keystoreProperties["storeFile"] ?: "keystore/scrollshot-release.jks")
                storePassword keystoreProperties["storePassword"] ?: ""
                keyAlias keystoreProperties["keyAlias"] ?: "scrollshot"
                keyPassword keystoreProperties["keyPassword"] ?: ""
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
        }
    }
}
